<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Pop</title>

  <style>
    body {
      margin: 0;
      background: #FAF8F4;
      color: #3F3B38;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 650px;
      padding: 60px;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
      text-align: center;
    }

    .icon {
      font-size: 42px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 54px;
      margin: 0;
      font-weight: normal;
    }

    h2 {
      color: #7FA8D8;
      font-size: 20px;
      font-weight: normal;
      letter-spacing: 2px;
      margin-top: 10px;
      margin-bottom: 40px;
    }

    p {
      line-height: 1.8;
      font-size: 20px;
    }

    button {
      margin-top: 35px;
      background: #8FAFD4;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 16px 42px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #7EA2CC;
    }
  </style>
</head>

<body>

<div class="card">

<div class="icon">🍿</div>

<h1>First Pop</h1>

<h2>First Edition</h2>

<p><strong>Happy Birthday, Kelsey.</strong></p>

<p>
I made this little app for us. I wanted to have a place of our own to log our movie nights, TV shows, and whatever we watch in between.
</p>

<p>
This is just the first pop 🍿  
</p>
</p>

<p>❤️ Elise</p>

<button>Begin</button>

</div>

</body>
</html>
